<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions in javascript</title>
</head>
<body>
    <h1>Functions in javascript</h1>
    <p>Functions are blocks of code that can be executed when called</p>
    <p>Example</p>
    <hr>
    <button onclick="myfunction()">click me</button>
    <p id="demo"></p>
    <script>
        var x=10
        function myfunction(){
            var y=20
            document.getElementById("demo").innerHTML= `${x} + ${y} =${x+y}`
        }
    </script>

    
</body>
</html>
